<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="market.css"></head><body>
<header class="nav" id="nav"><div class="wrap nav-in"><a href="index.html" class="brand"><span class="mark">H</span>Hunar</a>
<button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
<nav class="menu" id="menu"><a href="index.html">Home</a><a href="freelancers.html" class="active">Find Freelancers</a><a href="index.html#jobs">Find Jobs</a><a href="index.html#about">About</a>
<div class="auth"><button class="btn ghost" data-soon>Login</button><button class="btn solid" data-soon>Register</button></div></nav></div></header>
<main>
<section class="phead"><div class="wrap">
<h1>Find Freelancers</h1><p>Search services, then filter by category, price and rating.</p>
<form class="search" id="searchForm" role="search"><input id="q" type="search" placeholder="Search services, skills or names" aria-label="Search services"><button class="btn accent" type="submit">Search</button></form>
</div></section>
<section class="sec"><div class="wrap">
<div class="chips" id="chips"></div>
<div class="bar">
<label>Max starting price: <b id="pv">$60</b><input type="range" id="price" min="5" max="60" step="5" value="60"></label>
<label>Minimum rating<select id="rating"><option value="0">Any rating</option><option value="4.5">4.5 and up</option><option value="4.8">4.8 and up</option></select></label>
<label>Sort by<select id="sort"><option value="rating">Highest rated</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="reviews">Most reviews</option></select></label>
<button class="btn ghost" id="clear" type="button">Clear filters</button>
</div>
<p class="count" id="count" aria-live="polite"></p>
<div class="mgrid" id="grid"></div>
</div></section></main>
<footer class="foot"><div class="wrap foot-in">
<div><a href="index.html" class="brand light"><span class="mark">H</span>Hunar</a><p>Skilled freelancers, fairly paid.</p></div>

</body></html>
